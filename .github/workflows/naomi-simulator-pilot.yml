name: NAOMI SH4 simulator pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: naomi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare simulator runtime
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          mkdir -p build
          git clone --depth 1 --branch v0.1.48 https://github.com/lhsazevedo/sh4objtest.git build/sh4objtest
      - name: Compare retail, C, and deliberate mutants
        run: python3 tools/simulator_pilot/pilot.py --simulator build/sh4objtest --php php
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulator-pilot-evidence
          path: naomi/build/simulator-pilot/results.json
